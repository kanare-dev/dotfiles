# Starship プロンプト設定
# 詳細: https://starship.rs/config/

# 先頭の空行を出さない
add_newline = false

# 使用するカラーパレット
palette = "main"

# プロンプトのフォーマット
# 表示順: OS → ユーザー名 → ホスト名 → バッテリー → ディレクトリ
#         → Git(ブランチ/ステータス/メトリクス/コミット) → 時刻 → 実行時間
# ※ hostname/localip は SSH接続時のみ、cmd_duration は実行時間が長いときのみ表示される。
#   非表示時に矢印だけ浮かないよう、username/hostname/battery、time/cmd_duration は
#   それぞれ同色にして間の矢印セパレータを省略している
format = """
[](fg:color_os)\
$os\
[](fg:color_os bg:user_username)\
$username\
$hostname\
$battery\
[](fg:user_battery bg:color_dir)\
$directory\
[](fg:color_dir bg:git_branch_bg)\
$git_branch\
[](fg:git_branch_bg bg:git_status_bg)\
$git_status\
[](fg:git_status_bg bg:git_metrics_bg)\
$git_metrics\
[](fg:git_metrics_bg bg:git_commit_bg)\
$git_commit\
[](fg:git_commit_bg bg:time_bg)\
$time\
$cmd_duration\
[](fg:cmd_duration_bg)
[╰─────](bold cyan)$character"""

right_format = """
$nodejs\
$python\
$rust\
$golang\
$terraform\
$aws\
$docker_context\
$package\
$localip
"""

# ─────────────────────────────────────────────
# カラーパレット（色の一元管理）
#
# 表示順（グラデーション）:
#   OS → ユーザー名 → ホスト名 → バッテリー → ディレクトリ
#   → Git(ブランチ/ステータス/メトリクス/コミット) → 時刻 → 実行時間
#
# 色を変えたい場合はここだけ編集すればOK。
# ─────────────────────────────────────────────
[palettes.main]
# OS
color_os = "#005F73"

# ユーザー名・ホスト名・バッテリー（それぞれ別色）
user_username = "#0A9396"
user_hostname = "#0A9396"
user_battery = "#0A9396"

# ディレクトリ
color_dir = "#94D2BD"

# Git（ブランチ/ステータス/メトリクス/コミットそれぞれ別色）
git_branch_bg = "#E9D8A6"
git_status_bg = "#EE9B00"
git_metrics_bg = "#CA6702"
git_commit_bg = "#BB3E03"

# 時刻・実行時間（それぞれ別色）
time_bg = "#AE2012"
cmd_duration_bg = "#AE2012"

# color palette
#FFFFFF
#001219
#005F73
#0A9396
#94D2BD
#E9D8A6
#EE9B00
#CA6702
#BB3E03
#AE2012
#9B2226

# グラデーションとは独立した固定色（文字色や強調用）
white = "#F2F2F2"
light_gray = "#CFCFCF"
dark = "#303030"
gray = "#585858"
yellow = "#CCCC11"
red = "#AF0000"
node_green = "#8CC84B"
python_yellow = "#FFD75F"
rust_red = "#FF5F5F"
golang_cyan = "#5FD7FF"
terraform_purple = "#7B42BC"
aws_orange = "#FFAF5F"
docker_blue = "#5F87FF"

# os
[os]
style = "bg:color_os fg:light_gray"
format = "[ $symbol  ]($style)"
disabled = false

[os.symbols]
Macos = "" #リンゴのicon
Ubuntu = "" #Ubuntuのicon

# ユーザー名（通常は非表示、SSH接続時のみ表示）
[username]
show_always = true
format = "[  $user ]($style)"
style_user = "bg:user_username fg:dark"
style_root = "bg:user_username fg:dark"

# ホスト名（通常は非表示、SSH接続時のみ表示）
[hostname]
ssh_only = true
format = "[ $hostname ]($style)"
style = "bg:user_hostname fg:dark"

# バッテリー（バッテリー駆動時に表示されやすくする）
[battery]
full_symbol = "󰁹"
empty_symbol = ""
charging_symbol = "󰂄"
discharging_symbol = "󰂀"
unknown_symbol = "󰂑"
format = "[ $symbol$percentage ]($style)"

[[battery.display]]
threshold = 30
style = "bg:user_battery fg:light_gray"

# ディレクトリ
[directory]
style = "fg:dark bg:color_dir"
read_only = ""
read_only_style = "fg:red bg:color_dir"
format = "[ 󰉋 $path ]($style)[$read_only]($read_only_style)"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true
home_symbol = "󰋜 ~"
use_os_path_sep = false
fish_style_pwd_dir_length = 2

[directory.substitutions]
"Documents" = ""
"Downloads" = ""
"Music" = ""
"Pictures" = ""

# Git ブランチ
[git_branch]
symbol = ""
style = "bg:git_branch_bg fg:dark"
format = "[ $symbol $branch(:$remote_branch) ]($style)"
truncation_length = 20
truncation_symbol = "…"

# Git ステータス（変更がある場合のみ表示）
[git_status]
style = "bg:git_status_bg fg:dark"
format = "[\\[$all_status$ahead_behind\\]]($style)"
conflicted = "󰞇${count}"
up_to_date = "✓"
untracked = "󰋗 ${count}"
stashed = "󰏗${count}"
modified = "󰏫${count}"
staged = "●${count}"
renamed = "󰁕${count}"
deleted = "󰆴${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

# Git メトリクス
[git_metrics]
disabled = false
format = "[ +$added]($added_style)[/-$deleted]($deleted_style)"
added_style = "bg:git_metrics_bg fg:dark"
deleted_style = "bg:git_metrics_bg fg:dark"

# Git コミット（detached HEAD時など）
[git_commit]
style = "bg:git_commit_bg fg:white"
format = "[  $hash$tag ]($style)"
commit_hash_length = 4
only_detached = true
tag_symbol = " 🔖 "

# 左右分割（右寄せ用）
[fill]
symbol = "─"
style = "bold cyan"

# 実行時間（1秒以上かかったコマンドのみ表示）
[cmd_duration]
min_time = 1_000
format = "[  $duration ]($style)"
style = "bg:cmd_duration_bg fg:white"

# 時刻（右側に表示）
[time]
disabled = false
format = "[  $time ]($style)"
style = "bg:time_bg fg:white"
use_12hr = false
time_format = "%T"

# プロンプト記号
[character]
success_symbol = "[>](bold green) "
error_symbol = "[>](bold red) "
vimcmd_symbol = "[>](bold green) "

# Node.js
[nodejs]
format = "[   $version ]($style)"
symbol = ""
style = "fg:node_green"
detect_files = ["package.json"]
detect_folders = ["node_modules"]

# Python
[python]
format = "[   $version (${virtualenv})]($style)"
symbol = ""
style = "fg:python_yellow"
detect_files = [".python-version", "Pipfile", "__pycache__", "pyproject.toml", "requirements.txt", "setup.py", "tox.ini"]
detect_folders = []

# Rust
[rust]
format = "[   $version]($style)"
symbol = ""
style = "fg:rust_red"
detect_files = ["Cargo.toml", "Cargo.lock"]
detect_folders = []

# Go
[golang]
format = "[   $version]($style)"
symbol = ""
style = "fg:golang_cyan"
detect_files = ["go.mod", "go.sum", "glide.yaml", "Gopkg.yml", "Gopkg.lock", ".go-version"]
detect_folders = ["Godeps"]

# Terraform
[terraform]
format = "[  󱁢 $version ($workspace) ]($style)"
style = "fg:terraform_purple"
detect_extensions = ["tf", "tfvars", "tfplan", "tfstate", "hcl"]
detect_files = ["terraform.tfstate", ".terraform.lock.hcl", "terragrunt.hcl"]

# AWS（AWS_PROFILE があるときだけ profile を表示）
[aws]
disabled = false
format = "[  󰸏 $profile]($style)"
style = "fg:aws_orange"

# Docker コンテキスト
[docker_context]
format = "[  $symbol$context]($style)"
symbol = " "
style = "fg:docker_blue"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile", ".dockerignore"]
detect_folders = []

# パッケージ情報（package.json など）
[package]
format = "[  $symbol$version]($style)"
symbol = "󰏗 "
style = "fg:aws_orange"
display_private = false

# SSH時のローカルIP表示（必要なときだけ）
[localip]
ssh_only = true
format = "[  󰩟 $localipv4]($style)"
style = "fg:light_gray"
disabled = false
